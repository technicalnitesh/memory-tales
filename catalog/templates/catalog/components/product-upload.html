<div class="upload-section">

    <h4 class="mb-3">

        Upload Your Photo

    </h4>

    <div
        class="upload-box"
        id="uploadBox"
    >

        <input
            type="file"
            id="photoInput"
            accept="image/*"
            hidden
        >

        <div class="upload-content">

            <div class="upload-icon">

                📷

            </div>

            <h5>

                Drag & Drop Your Photo

            </h5>

            <p>

                or Click to Browse

            </p>

            <small>

                JPG, PNG, WEBP (Max 10MB)

            </small>

        </div>

    </div>

</div>

<div
    id="previewSection"
    class="preview-section mt-4"
    style="display:none;"
>

    <h5>

        Preview

    </h5>

    <img
        id="previewImage"
        class="preview-image"
    >

</div>
